    Ставки в ред. ФЗ от 08.08.2024 № 259-ФЗ, применяются к искам и жалобам,
    направленным после 08.09.2024. Значения проверять на дату подачи.

  gpk_property_claim:
    formula: "tiered"
    tiers:
      - { up_to: 100000, base: 4000 }
      - { up_to: 300000, base: 4000, percent_over: 3, threshold: 100000 }
      - { up_to: 500000, base: 10000, percent_over: 2.5, threshold: 300000 }
      - { up_to: 1000000, base: 15000, percent_over: 2, threshold: 500000 }
      - { up_to: 3000000, base: 25000, percent_over: 1, threshold: 1000000 }
      - { up_to: 8000000, base: 45000, percent_over: 0.7, threshold: 3000000 }
      - { up_to: 24000000, base: 80000, percent_over: 0.35, threshold: 8000000 }
      - { up_to: 50000000, base: 136000, percent_over: 0.3, threshold: 24000000 }
      - { up_to: 100000000, base: 214000, percent_over: 0.2, threshold: 50000000 }
      - { over: 100000000, base: 314000, percent_over: 0.15, max: 900000 }
