# Российское законодательство — константы на 2026 год
#
# Этот файл — single source of truth для всех hardcoded values в skills.
# Skills НЕ должны хардкодить эти числа в тексте — должны ссылаться на этот файл
# (либо через constants.get(...) tool из constants-mcp).
#
# Обновляется ежемесячно или при изменении законодательства.
# Каждое значение сопровождается source + source_date для аудита.

metadata:
  year: 2026
  last_updated: "2026-10-20"
  maintainer: "@zhuga79"
  next_review: "2026-11-20"
  verification: >
    Значения сверены с первоисточниками 2026-10-20 (kremlin.ru, consultant.ru,
    nalog.gov.ru). При расхождении приоритет — действующая редакция НК РФ / ФЗ.

# ============================================================================
# ТРУДОВОЕ ПРАВО
# ============================================================================
labor:
  min_wage:
    value: 27093
    unit: "RUB/month"
    source: "ФЗ от 28.11.2025 № 429-ФЗ (ред. ст. 1 ФЗ от 19.06.2000 № 82-ФЗ)"
    source_date: "2025-11-28"
    note: >
      МРОТ с 01.01.2026. Применяется для зарплаты, больничных, взносов.
      МРОТ-2025 = 22 440 ₽. Региональная минимальная зарплата (ст. 133.1 ТК)
      может быть выше — проверять региональное соглашение.

  max_unemployment_benefit:
    first_3_months: 15886
    next_3_months: 6209
    minimum: 1863
    unit: "RUB/month"
    source: "ПП РФ от 23.01.2026 № 30 (индексация с 01.02.2026)"
    source_date: "2026-01-23"
    note: "В районах Крайнего Севера и приравненных местностях — с районным коэффициентом"

  ndfl_base_rate:
    value: 13
    unit: "percent"
    source: "НК РФ ст.224 п.1"

  ndfl_progressive_scale:  # пятиступенчатая шкала с 2025 года
    brackets:
      - { up_to: 2400000, rate: 13 }
      - { up_to: 5000000, rate: 15 }
      - { up_to: 20000000, rate: 18 }
      - { up_to: 50000000, rate: 20 }
      - { over: 50000000, rate: 22 }
    unit: "percent"
    source: "НК РФ ст. 224 п. 1 (ред. ФЗ от 12.07.2024 № 176-ФЗ)"
    note: "Прогрессия применяется к совокупности налоговых баз; проверять актуальные пороги"

  ndfl_non_resident:
    value: 30
    unit: "percent"
    source: "НК РФ ст.224 п.3"

