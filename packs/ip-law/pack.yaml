    user_invocable: true
    portability: B
    from_anthropic: false
    ported_from: intellektualnaya-sobstvennost/skills/rasporyazhenie-pravami
  - id: tovarnyj-znak
    path: skills/tovarnyj-znak/SKILL.md
    user_invocable: true
    portability: B
    from_anthropic: false
    ported_from: intellektualnaya-sobstvennost/skills/tovarnyj-znak
  - id: priem-razrabotki
    path: skills/priem-razrabotki/SKILL.md
    user_invocable: true
    portability: B
    from_anthropic: false
    ported_from: intellektualnaya-sobstvennost/skills/priem-razrabotki

profile:
