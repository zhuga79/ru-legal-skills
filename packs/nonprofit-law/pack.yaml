  - id: grant
    path: skills/grant/SKILL.md
    user_invocable: true
    portability: B
    from_anthropic: false
    ported_from: nekommercheskie-organizacii/skills/grant
  - id: pozhertvovanie
    path: skills/pozhertvovanie/SKILL.md
    user_invocable: true
    portability: B
    from_anthropic: false
    ported_from: nekommercheskie-organizacii/skills/pozhertvovanie
  - id: organy-i-resheniya
    path: skills/organy-i-resheniya/SKILL.md
    user_invocable: true
    portability: B
    from_anthropic: false
    ported_from: nekommercheskie-organizacii/skills/organy-i-resheniya
  - id: otchetnost-minyust
